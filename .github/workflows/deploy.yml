name: Validar, compilar y publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Todos los días 8:40 (Buenos Aires), después de la tarea diaria con Chrome:
  # chequea Mercado Libre, saca lo pausado y recompila para ocultar lo que no se verificó.
  schedule:
    - cron: "40 11 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Chequear avisos de Mercado Libre
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: chequeo
        run: node scripts/chequear-ml.mjs
      - name: Guardar el chequeo
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git diff --quiet data/ && exit 0
          git config user.name "chequeo-diario"
          git config user.email "chequeo-diario@users.noreply.github.com"
          git add data/oportunidades.json data/ultimo-chequeo.json
          git commit -m "datos: chequeo automático $(TZ=America/Argentina/Buenos_Aires date +%F) (−${{ steps.chequeo.outputs.bajas }} bajas en Mercado Libre)"
          git pull --rebase -q origin main && git push -q origin HEAD:main
      - name: Validar datos
        run: node scripts/validar.mjs
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Revisar tipos
        run: npx tsc --noEmit
      - name: Compilar sitio estático
        run: npm run build
        env:
          # En GitHub Pages el sitio vive en /inmobiliario
          NEXT_PUBLIC_BASE_PATH: /inmobiliario
          NEXT_PUBLIC_SITE_URL: https://gastonberardo28-ux.github.io/inmobiliario
      - run: touch out/.nojekyll
      # En los PR se guarda el sitio compilado en la rama "vista-previa" para poder revisarlo
      - name: Guardar compilado del PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          cd out
          git init -q -b vista-previa
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Compilado de ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" vista-previa
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: out

  publicar:
    if: github.event_name != 'pull_request'
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
